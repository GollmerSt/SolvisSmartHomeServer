# Anzeigenamen der Home-Assistant-Entities (UTF-8).
#
# Schluessel: vollstaendiger Kanalname (z.B. A07.Ladepumpe) oder nur die Kanal-Id (z.B. S01).
# Der vollstaendige Name hat Vorrang, damit konfigurationsabhaengige Belegungen (A07, A13, S14 ...)
# unterschieden werden koennen.
# Wert: Anzeigename, optional gefolgt von "|diagnostic" oder "|config" (entity_category)
# und "|disabled" (Entity in Home Assistant standardmaessig deaktiviert).
# Ohne Eintrag wird der Name aus dem Kanalnamen abgeleitet (CamelCase getrennt, "_" -> " ").
#
# Begriffe nach SolvisMax-Anschlussplan (ALS-MAX) und SolvisControl-2-Bildschirmen.

